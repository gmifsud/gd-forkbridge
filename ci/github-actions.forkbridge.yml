# Example: ForkBridge in GitHub Actions (provider-independent core; same commands as Azure DevOps).
name: forkbridge
on:
  workflow_dispatch:
    inputs:
      pair: { default: backend }
      from: { default: isl }
      to: { default: qisl }
      sourceRef: { required: true }
jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      FORKBRIDGE_TRUST_VALIDATION: "1"
      FORKBRIDGE_CONFIG: ${{ github.workspace }}/forkbridge.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: OWNER/ISL-Backend, path: repos/ISL-Backend, fetch-depth: 0, token: ${{ secrets.REPO_READ_TOKEN }} }   # PLACEHOLDER
      - uses: actions/checkout@v4
        with: { repository: OWNER/Backend, path: repos/Backend, fetch-depth: 0, token: ${{ secrets.REPO_READ_TOKEN }} }           # PLACEHOLDER
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - name: plan + simulate
        shell: pwsh
        run: |
          dotnet build src/ForkBridge.Cli -c Release
          $fb = "src/ForkBridge.Cli/bin/Release/net10.0/forkbridge.dll"
          dotnet $fb plan --pair ${{ inputs.pair }} --from ${{ inputs.from }} --to ${{ inputs.to }} --source-ref ${{ inputs.sourceRef }} --json > plan.json
          if ($LASTEXITCODE -notin 0, 10) { exit $LASTEXITCODE }
          $run = dotnet $fb simulate --plan (Get-Content plan.json | ConvertFrom-Json).id --json | ConvertFrom-Json
          $code = $LASTEXITCODE
          dotnet $fb report --run $run.id --format markdown >> $env:GITHUB_STEP_SUMMARY
          exit $code
